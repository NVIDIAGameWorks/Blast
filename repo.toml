########################################################################################################################
# Repo tool base settings
########################################################################################################################

[repo]

# Repository Name. It is used for solution name and final package name
name = "blast-sdk"


########################################################################################################################
# Build tool setup
########################################################################################################################

[repo_build]

# Public builds use the developer's native Linux toolchain.  Do not fetch or
# launch the NVIDIA-internal linbuild image.
docker.enabled = false

# List of packman projects to pull (in order)
fetch.packman_host_files_to_pull = [
    "${root}/deps/host-deps.packman.xml",
]
fetch.packman_target_files_to_pull = [
    "${root}/deps/target-deps.packman.xml",
]

# Public Windows builds use Visual Studio and the Windows SDK installed on the
# developer's machine instead of Packman-distributed toolchain packages.
msbuild.link_host_toolchain = true
msbuild.sln_file = "blast-sdk.sln"
msbuild.vs_version = "vs2019"

[[repo_build.argument]]
name = "--physx-path"
help = "Path to an unpacked PhysX SDK binary distribution. If omitted, PhysX-dependent projects are not generated."
kwargs.required = false
kwargs.nargs = 1
extra_premake_args = ["--physx-path={}"]

[[repo_build.argument]]
name = "--physx-lib-path"
help = "Optional path to the PhysX binary directory containing debug/ and release/ subdirectories."
kwargs.required = false
kwargs.nargs = 1
extra_premake_args = ["--physx-lib-path={}"]

[[repo_build.argument]]
name = "--samples"
help = "Build the Windows SampleAssetViewer. Requires --physx-path."
kwargs.required = false
kwargs.nargs = 0
extra_premake_args = ["--samples=1"]
platforms = ["windows*"]
