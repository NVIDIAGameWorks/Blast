########################################################################################################################
# Memo:
########################################################################################################################

# Mappings ($ string substitutions). Name and examples:
# |==========================================================
# | $platform      | 'windows-x86_64'     | 'linux-x86_64'  | 
# |----------------------------------------------------------
# | $lib_ext       | '.dll'               | '.so'           |
# | $lib_prefix    | ''                   | 'lib'           |
# | $bindings_ext  | '.pyd'               | '.so'           |
# | $exe_ext       | '.exe'               | ''              |
# | $shell_ext     | '.bat'               | '.sh'           |
# |==========================================================
#
# |==========================================================
# | $config        | 'debug'              | 'release'       |
# |==========================================================

# Filters. For example, if packaging gfx, debug, on linux-x86_64 all those toml keys will be used for this package:
# [gfx.linux-x86_64]
# [gfx.debug]
# [gfx.linux.debug]
# So you can use those in any order as a keys: ["gfx", "linux-x86_64", "debug", "linux", "x86_64"]

# Note that keys can only contain ASCII letters, ASCII digits, underscores, and dashes (A-Za-z0-9_-). If anything else
# is in the key you need to quote it. E.g. "carb_sdk+plugins".


########################################################################################################################
# Common section:
########################################################################################################################

files = []


########################################################################################################################
# blastsdk package
########################################################################################################################

